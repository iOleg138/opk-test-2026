<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ОПК — карточки для закрепления</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #fdf6e3;
    margin: 0;
    padding: 16px;
    color: #3e2723;
    line-height: 1.5;
  }
  .container { max-width: 720px; margin: 0 auto; }
  header {
    background: #8d6e63;
    color: white;
    padding: 16px 20px;
    border-radius: 12px;
    margin-bottom: 16px;
    text-align: center;
  }
  header h1 { margin: 0 0 4px; font-size: 20px; }
  header p { margin: 0; font-size: 13px; opacity: 0.9; }
  .toolbar {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }
  .toolbar button {
    flex: 1;
    min-width: 140px;
    padding: 10px 12px;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.2s;
  }
  .btn-primary { background: #8d6e63; color: white; }
  .btn-primary:hover { background: #6d4c41; }
  .btn-secondary { background: #d7ccc8; color: #3e2723; }
  .btn-secondary:hover { background: #bcaaa4; }
  .btn-danger { background: #c62828; color: white; }
  .progress-bar {
    background: #d7ccc8;
    height: 8px;
    border-radius: 4px;
    overflow: hidden;
    margin-bottom: 16px;
  }
  .progress-fill {
    background: #558b2f;
    height: 100%;
    transition: width 0.3s;
  }
  .stats {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    color: #5d4037;
    margin-bottom: 8px;
  }
  .card {
    background: white;
    border-radius: 12px;
    padding: 20px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  }
  .question-num {
    font-size: 12px;
    color: #8d6e63;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 8px;
  }
  /* Плашка с правильным ответом */
  .answer-hint {
    background: #e3f2fd;
    border-left: 5px solid #1976d2;
    border-radius: 8px;
    padding: 12px 16px;
    margin-bottom: 16px;
    font-size: 15px;
  }
  .answer-hint .label {
    font-weight: 700;
    color: #0d47a1;
    display: block;
    margin-bottom: 4px;
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .answer-hint .value {
    font-weight: 600;
    color: #1a237e;
    font-size: 16px;
  }
  .answer-hint .ex {
    margin-top: 6px;
    color: #37474f;
    font-size: 13px;
    font-style: italic;
  }
  .question-text {
    font-size: 17px;
    font-weight: 600;
    margin-bottom: 16px;
    color: #3e2723;
  }
  .options { display: flex; flex-direction: column; gap: 8px; }
  .option {
    padding: 12px 14px;
    border: 2px solid #d7ccc8;
    border-radius: 8px;
    cursor: pointer;
    transition: 0.15s;
    font-size: 15px;
    background: white;
    text-align: left;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .option:hover:not(.disabled) { border-color: #8d6e63; background: #efebe9; }
  .option.correct { border-color: #558b2f; background: #f1f8e9; }
  .option.wrong { border-color: #c62828; background: #ffebee; animation: shake 0.3s; }
  .option.disabled { cursor: default; }
  .option .mark {
    font-weight: bold;
    width: 20px;
    text-align: center;
    flex-shrink: 0;
  }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-4px); }
    75% { transform: translateX(4px); }
  }
  .feedback {
    margin-top: 14px;
    padding: 12px 14px;
    border-radius: 6px;
    font-size: 15px;
    font-weight: 600;
    display: none;
  }
  .feedback.show { display: block; }
  .feedback.correct { background: #f1f8e9; color: #33691e; border-left: 4px solid #558b2f; }
  .feedback.wrong { background: #ffebee; color: #b71c1c; border-left: 4px solid #c62828; }
  .actions { margin-top: 16px; display: flex; gap: 8px; flex-wrap: wrap; }
  .actions button {
    padding: 12px 20px;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  .hidden { display: none; }
  @media (max-width: 500px) {
    .question-text { font-size: 16px; }
    .option { font-size: 14px; padding: 10px 12px; }
    .answer-hint .value { font-size: 15px; }
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>⛪ ОПК — карточки для закрепления</h1>
    <p>4 класс · читаем ответ → выбираем → закрепляем</p>
  </header>

  <div class="toolbar">
    <button id="shuffleBtn" class="btn-secondary">🔀 Перемешать</button>
    <button id="resetBtn" class="btn-danger">🔄 Начать заново</button>
  </div>

  <div class="stats">
    <span id="progressText">Карточка 1 из 65</span>
    <span id="scoreText">Выучено: 0</span>
  </div>
  <div class="progress-bar"><div id="progressFill" class="progress-fill" style="width:0%"></div></div>

  <div id="quizContainer" class="card">
    <div id="questionNum" class="question-num"></div>

    <!-- Плашка с правильным ответом — показывается СРАЗУ -->
    <div class="answer-hint" id="answerHint">
      <span class="label">✓ Правильный ответ</span>
      <span class="value" id="answerValue"></span>
      <div class="ex" id="answerEx"></div>
    </div>

    <div id="questionText" class="question-text"></div>
    <div id="options" class="options"></div>
    <div id="feedback" class="feedback"></div>
    <div class="actions">
      <button id="nextBtn" class="btn-primary hidden">Следующая карточка →</button>
      <button id="finishBtn" class="btn-primary hidden">Завершить</button>
    </div>
  </div>

  <div id="finishScreen" class="card hidden" style="text-align:center;">
    <h2>Готово! 🎉</h2>
    <p id="finishText" style="font-size: 16px;"></p>
    <div class="actions" style="justify-content:center;">
      <button id="restartBtn" class="btn-primary">Пройти заново</button>
    </div>
  </div>
</div>

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function renderQuestion() {
  const q = currentQuestions[currentIndex];
  answered = false;

  $('questionNum').textContent = `Карточка ${currentIndex + 1} из ${currentQuestions.length}`;
  $('progressText').textContent = `Карточка ${currentIndex + 1} из ${currentQuestions.length}`;
  $('progressFill').style.width = `${(currentIndex / currentQuestions.length) * 100}%`;
  $('scoreText').textContent = `Выучено: ${learned}`;

  // Показываем правильный ответ СРАЗУ
  $('answerValue').textContent = q.correct;
  const exEl = $('answerEx');
  if (q.ex) {
    exEl.textContent = q.ex;
    exEl.style.display = 'block';
  } else {
    exEl.textContent = '';
    exEl.style.display = 'none';
  }

  $('questionText').textContent = q.q;
  $('feedback').className = 'feedback';
  $('feedback').textContent = '';
  $('nextBtn').classList.add('hidden');
  $('finishBtn').classList.add('hidden');

  const optionsEl = $('options');
  optionsEl.innerHTML = '';
  const opts = shuffle(q.o);
  opts.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'option';
    btn.innerHTML = `<span class="mark"></span><span>${opt}</span>`;
    btn.onclick = () => selectOption(btn, opt, q);
    optionsEl.appendChild(btn);
  });
}

function selectOption(btn, chosen, q) {
  if (answered) return;

  const isCorrect = chosen === q.correct;

  if (isCorrect) {
    // Правильно — блокируем выбор, показываем похвалу, открываем «Далее»
    answered = true;
    document.querySelectorAll('.option').forEach(o => {
      o.classList.add('disabled');
      o.onclick = null;
      o.classList.remove('wrong');
    });
    btn.classList.add('correct');
    btn.querySelector('.mark').textContent = '✓';

    const fb = $('feedback');
    fb.className = 'feedback show correct';
    fb.textContent = '🎉 Молодец! Правильно.';

    learned++;
    $('scoreText').textContent = `Выучено: ${learned}`;

    if (currentIndex < currentQuestions.length - 1) {
      $('nextBtn').classList.remove('hidden');
    } else {
      $('finishBtn').classList.remove('hidden');
    }
  } else {
    // Неправильно — красная подсветка, но можно попробовать ещё раз
    btn.classList.add('wrong');
    btn.querySelector('.mark').textContent = '✗';

    const fb = $('feedback');
    fb.className = 'feedback show wrong';
    fb.textContent = '❌ Попробуй ещё раз. Подсказка сверху!';
  }
}

function nextQuestion() {
  if (currentIndex < currentQuestions.length - 1) {
    currentIndex++;
    renderQuestion();
  }
}

function finishQuiz() {
  $('quizContainer').classList.add('hidden');
  $('finishScreen').classList.remove('hidden');
  $('finishText').textContent = `Ты выучил(а) ${learned} из ${currentQuestions.length} карточек. Молодец!`;
}

function resetQuiz() {
  currentIndex = 0;
  learned = 0;
  $('quizContainer').classList.remove('hidden');
  $('finishScreen').classList.add('hidden');
  renderQuestion();
  $('scoreText').textContent = 'Выучено: 0';
}

$('nextBtn').onclick = nextQuestion;
$('finishBtn').onclick = finishQuiz;
$('restartBtn').onclick = resetQuiz;
$('resetBtn').onclick = resetQuiz;

$('shuffleBtn').onclick = () => {
  currentQuestions = shuffle(QUESTIONS);
  resetQuiz();
};

renderQuestion();
</script>
</body>
</html>
